<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HACKER ANKIT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#050509;color:#fff}
body{display:flex;align-items:center;justify-content:center}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.overlay{position:fixed;inset:0;background:
 radial-gradient(circle at 50% 45%,rgba(255,0,130,.12),transparent 28%),
 radial-gradient(circle at 20% 80%,rgba(0,180,255,.10),transparent 30%),
 linear-gradient(135deg,rgba(0,0,0,.72),rgba(8,0,20,.35),rgba(0,0,0,.78));
 z-index:1}
.screen{position:relative;z-index:2;width:min(92vw,720px);text-align:center}
.intro{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
.brand{font-size:clamp(2.65rem,10vw,8.5rem);font-weight:1000;letter-spacing:.045em;line-height:1;white-space:nowrap;
 text-transform:uppercase;filter:drop-shadow(0 0 12px rgba(255,0,170,.55));}
.char{display:inline-block;opacity:0;transform:translateY(70px) rotateX(90deg) rotateZ(-12deg) scale(.2);
 animation:charIn .75s cubic-bezier(.16,1.3,.3,1) forwards, float 2.8s ease-in-out infinite;
 animation-delay:var(--d),calc(var(--d) + 1.1s)}
.char:nth-child(3n){text-shadow:0 0 12px #ff168d,0 0 35px #ff168d}
.char:nth-child(3n+1){text-shadow:0 0 12px #00d9ff,0 0 35px #00d9ff}
.char:nth-child(3n+2){text-shadow:0 0 12px #8d5cff,0 0 35px #8d5cff}
@keyframes charIn{to{opacity:1;transform:translateY(0) rotateX(0) rotateZ(0) scale(1)}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
.tag{margin-top:22px;letter-spacing:.45em;font-size:12px;color:#c9c9d4;text-transform:uppercase;opacity:0;
 animation:fade 1s 3.2s forwards}
@keyframes fade{to{opacity:1}}
.logo{width:112px;height:112px;margin:32px auto 22px;border-radius:29px;position:relative;
 background:linear-gradient(135deg,#feda75 0%,#fa7e1e 24%,#d62976 55%,#962fbf 78%,#4f5bd5 100%);
 box-shadow:0 0 30px rgba(225,48,108,.42);opacity:0;transform:scale(.2) rotate(-35deg);
 animation:logoIn 1s 3.5s cubic-bezier(.2,1.4,.3,1) forwards}
.logo:before{content:"";position:absolute;width:57px;height:57px;border:7px solid white;border-radius:18px;
 left:20px;top:20px}
.logo:after{content:"";position:absolute;width:15px;height:15px;background:white;border-radius:50%;right:17px;top:17px;
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.02)}
@keyframes logoIn{to{opacity:1;transform:scale(1) rotate(0)}}
.start{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;
 padding:16px 30px;border-radius:999px;font-size:16px;font-weight:800;letter-spacing:.12em;
 cursor:pointer;backdrop-filter:blur(14px);box-shadow:0 0 25px rgba(255,0,150,.15);
 opacity:0;transform:translateY(20px);animation:fadeUp .8s 4.2s forwards;transition:.25s}
.start:before{content:"";position:absolute;inset:-3px;border-radius:999px;padding:2px;background:conic-gradient(from 0deg,#00eaff,#1976ff,#00ff9d,#00eaff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 1.7s linear infinite;pointer-events:none}
.start:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;right:22px;top:50%;transform:translateY(-50%);border:2px solid #00eaff;border-top-color:#00ff9d;animation:spin 1s linear infinite;box-shadow:0 0 14px #00eaff;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.start{z-index:1}.start:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 0 35px rgba(255,0,150,.4)}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.panel{display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column}
.panel.show{display:flex}
.card{width:min(92vw,430px);padding:32px;border-radius:26px;background:rgba(10,10,18,.65);
 border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(18px);box-shadow:0 20px 80px rgba(0,0,0,.55)}
.card h2{font-size:28px;margin-bottom:10px}
.card p{color:#aaa;margin-bottom:22px;line-height:1.5}
.safe{display:block;text-decoration:none;color:#fff;background:linear-gradient(90deg,#833ab4,#e1306c,#f77737);
 padding:14px;border-radius:12px;font-weight:800}
.back{margin-top:15px;background:none;border:0;color:#aaa;cursor:pointer}
.hint{font-size:11px;color:#777;margin-top:18px}
</style>
</head>
<body>
<canvas id="space"></canvas>
<div class="overlay"></div>

<main class="screen">
  <section class="intro" id="intro">
    <div class="brand" id="brand"></div>
    <div class="tag">NEON DIGITAL EXPERIENCE</div>
    <div class="logo" aria-label="Instagram style logo"></div>
    <button class="start" id="start">START / LOGIN INSTAGRAM</button>
  </section>

  <section class="panel" id="panel">
    <div class="card">
      <h2>Instagram Account</h2>
      <p>Use Instagram's official recovery/login flow for your own account. This demo does not guess or collect passwords.</p>
      <a class="safe" href="https://www.instagram.com/accounts/login/" target="_blank" rel="noopener">OPEN INSTAGRAM</a>
      <button class="back" id="back">← Back to intro</button>
      <div class="hint">Demo UI • No password harvesting or brute-force</div>
    </div>
  </section>
</main>

<script>
const brand = document.getElementById("brand");
const name = "HACKER ANKIT";
[...name].forEach((ch,i)=>{
  if(ch===" "){brand.appendChild(document.createTextNode(" ")); return;}
  const s=document.createElement("span");
  s.className="char"; s.textContent=ch; s.style.setProperty("--d",(i*.13)+"s");
  brand.appendChild(s);
});

const canvas=document.getElementById("space"), ctx=canvas.getContext("2d");
let W,H,stars=[];
function resize(){
  W=canvas.width=innerWidth*devicePixelRatio; H=canvas.height=innerHeight*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=innerWidth; H=innerHeight;
  stars=Array.from({length:Math.min(150,Math.floor(W/7))},()=>({
    x:Math.random()*W,y:Math.random()*H,z:Math.random()*1+.2,r:Math.random()*1.5+.2
  }));
}
function animate(){
  ctx.clearRect(0,0,W,H);
  for(const s of stars){
    s.y += s.z*.25;
    if(s.y>H)s.y=0;
    ctx.globalAlpha=.25+s.z*.55;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r*s.z,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
  }
  requestAnimationFrame(animate);
}
addEventListener("resize",resize); resize(); animate();

const intro=document.getElementById("intro"), panel=document.getElementById("panel");
document.getElementById("start").onclick=()=>{intro.style.display="none";panel.classList.add("show")};
document.getElementById("back").onclick=()=>{panel.classList.remove("show");intro.style.display="flex"};
</script>
</body>
</html>
